# ============================================================
# Docker Compose — OCR口座振替依頼書処理システム（本番環境）
# ============================================================
# 起動: docker compose up -d
# 停止: docker compose down
# ログ: docker compose logs -f
# ============================================================

services:
  # ==========================================
  # Nginx — Reverse Proxy + SSL終端
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ocr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ocr-network

  # ==========================================
  # Frontend — Next.js (Standalone)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ocr-frontend
    environment:
      - NODE_ENV=production
      # Next.jsサーバーが /api/* を受けた場合のプロキシ先（実行時に評価される）
      - API_PROXY_TARGET=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ocr-network

  # ==========================================
  # Backend — FastAPI + uvicorn
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ocr-backend
    env_file:
      - .env
    volumes:
      - upload-data:/app/backend/temp
      - app-logs:/app/logs
      - ./backend/data/zengin_cache:/app/backend/data/zengin_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ocr-network

# ==========================================
# ボリューム定義
# ==========================================
volumes:
  upload-data:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local

# ==========================================
# ネットワーク定義
# ==========================================
networks:
  ocr-network:
    driver: bridge
