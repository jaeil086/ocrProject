# ============================================================
# Nginx設定 — OCR口座振替依頼書処理システム
# ============================================================
# 役割:
#   - Reverse Proxy（Frontend + Backend API）
#   - SSL/TLS終端（HTTPS対応）
#   - HTTP→HTTPSリダイレクト
#   - セキュリティヘッダー
#   - Gzip圧縮
#   - アップロードサイズ制限
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- ログフォーマット ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # --- 基本設定 ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Gzip圧縮 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_min_length 1024;

    # --- アップロードサイズ上限（PDF: 最大50MB） ---
    client_max_body_size 50M;

    # --- クライアントヘッダーバッファ拡張 ---
    # 認証Cookie（大きなJWT）を保持したブラウザからのリクエストヘッダーが
    # デフォルト上限を超えないよう拡張する。
    large_client_header_buffers 8 32k;

    # --- レート制限（DDoS対策） ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # --- アップストリーム定義 ---
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ==========================================================
    # HTTP → HTTPS リダイレクト
    # ==========================================================
    server {
        listen 80;
        server_name _;

        # ヘルスチェック用（ALB/Docker healthcheck）
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME チャレンジ
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # その他は全てHTTPSへリダイレクト
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================
    # HTTPS メインサーバー
    # ==========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- SSL/TLS設定 ---
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- セキュリティヘッダー ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- Backend API ---
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # レスポンスヘッダーバッファ拡張
            # Cognito認証のコールバックでは大きなJWT（access/id/refresh）を複数の
            # Set-Cookieヘッダーで返すため、デフォルト(8k)では "upstream sent too big header"
            # となる。ヘッダーバッファを拡張して受け切れるようにする。
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # OCR処理のため長めのタイムアウト（5分）
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # --- アップロードエンドポイント（レート制限強化） ---
        location /api/upload {
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /api/batch/upload {
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # --- Frontend (Next.js) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # --- Next.js 静的ファイルキャッシュ ---
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # --- favicon等の静的アセット ---
        location /public/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
